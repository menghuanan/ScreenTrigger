[package]
name = "screen-trigger"
version = "0.1.0"
description = "ScreenTrigger native host core for the Windows desktop application"
edition = "2021"

[lib]
name = "screen_trigger_lib"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.27.0", features = ["v4"] }
sha2 = "=0.10.9"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
