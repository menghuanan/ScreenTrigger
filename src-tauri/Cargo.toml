# ScreenTrigger 桌面壳（Rust Host，TASK-004）

[package]
name = "screen-trigger"
version = "0.1.0"
description = "ScreenTrigger desktop shell - Tauri 2 host with Python sidecar supervisor"
edition = "2021"

[lib]
name = "screen_trigger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }

# 依赖清单严格对齐设计说明 §7.2（六项，不引入 tokio/log/tauri-plugin-shell）。
# 注①：windows 需追加 Win32_Security——CreateJobObjectW 的 SECURITY_ATTRIBUTES
# 参数在 windows 0.62 中被该 feature 门控（实施时必要修正，已报告主理人）。
# 注②：设计修订-01（分支 A 命名管道 stdio）追加 Win32_System_Pipes /
# Win32_Storage_FileSystem / Win32_System_IO 三个 feature（ConnectNamedPipe 签名
# 引用 IO::OVERLAPPED 故需 IO）——仍不新增 crate。
[dependencies]
tauri = { version = "^2", features = [] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
uuid = { version = "^1", features = ["v4"] }
# TASK-009：导入 token 的 HMAC-SHA256 签名（sha2 原为 tauri 传递依赖，此处提为直接依赖；
# 版本与 Cargo.lock 已缓存一致，离线可解析）。
sha2 = "0.10"
windows = { version = "^0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
